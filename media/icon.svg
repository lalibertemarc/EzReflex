<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#43226a"/>
      <stop offset="0.6" stop-color="#22113c"/>
      <stop offset="1" stop-color="#110820"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e5b94c"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fe3a6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6fe3a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0ffef"/>
      <stop offset="0.5" stop-color="#6fe3a6"/>
      <stop offset="1" stop-color="#24875a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- a figure bowing to its right; feet at the origin -->
    <g id="bower">
      <!-- the arm swept out behind -->
      <path d="M50,-110 Q14,-150 -22,-146" fill="none" stroke="#3a2306" stroke-width="18" stroke-linecap="round"/>
      <path d="M50,-110 Q14,-150 -22,-146" fill="none" stroke="#e5b94c" stroke-width="12" stroke-linecap="round"/>
      <path d="M-34,0 C-34,-40 -26,-68 -14,-82 L14,-82 C24,-68 32,-40 32,0 Z"/>
      <rect x="-19" y="-152" width="38" height="78" rx="18" transform="rotate(62 0 -82)"/>
      <circle cx="82" cy="-112" r="22"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff6d0" opacity="0.8">
    <circle cx="30" cy="40" r="1.6"/><circle cx="372" cy="250" r="1.8"/><circle cx="118" cy="26" r="1.4"/>
    <circle cx="210" cy="380" r="1.4"/><circle cx="24" cy="210" r="1.8"/><circle cx="378" cy="36" r="1.4"/>
  </g>

  <!-- soft glow behind the exchange -->
  <ellipse cx="200" cy="160" rx="160" ry="120" fill="url(#aura)"/>

  <!-- the exchange: a bow goes over, a bow comes back -->
  <g transform="translate(200,118) scale(1.15) translate(-200,-92)" stroke-linejoin="round" stroke-linecap="round">
    <g fill="none" stroke="#0f3a26" stroke-width="22">
      <path d="M152.7,83.7 A48,48 0 0 1 241.6,68"/>
      <path d="M247.3,100.3 A48,48 0 0 1 158.4,116"/>
    </g>
    <g fill="#0f3a26" stroke="#0f3a26" stroke-width="8">
      <path d="M259,58 L248,92 L224,72 Z"/>
      <path d="M141,126 L152,92 L176,112 Z"/>
    </g>
    <g filter="url(#glow)">
      <g fill="none" stroke="url(#lit)" stroke-width="12">
        <path d="M152.7,83.7 A48,48 0 0 1 241.6,68"/>
        <path d="M247.3,100.3 A48,48 0 0 1 158.4,116"/>
      </g>
      <g fill="url(#lit)">
        <path d="M259,58 L248,92 L224,72 Z"/>
        <path d="M141,126 L152,92 L176,112 Z"/>
      </g>
    </g>
  </g>

  <!-- the two of them -->
  <ellipse cx="74" cy="350" rx="70" ry="16" fill="url(#pool)"/>
  <ellipse cx="326" cy="350" rx="70" ry="16" fill="url(#pool)"/>
  <g stroke="#3a2306" stroke-width="2.8" stroke-linejoin="round" fill="url(#gold)">
    <use xlink:href="#bower" transform="translate(66,352) scale(1.12)"/>
    <use xlink:href="#bower" transform="translate(334,352) scale(-1.12,1.12)"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff6d0">
    <path d="M358,82 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M42,96 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
    <path d="M200,330 l2.5,7.5 l7.5,2.5 l-7.5,2.5 l-2.5,7.5 l-2.5,-7.5 l-7.5,-2.5 l7.5,-2.5 z"/>
  </g>
  <g fill="#6fe3a6" filter="url(#glow)">
    <circle cx="366" cy="240" r="3.5"/><circle cx="34" cy="150" r="3"/><circle cx="200" cy="40" r="2.5"/>
  </g>
</svg>
